# Three containers: a real Chrome you can sign in to through your browser (profile kept on disk), the MCP server that
# drives it, and Caddy for HTTPS. Values come from .env (written by install.sh).
services:
  chromium:
    image: lscr.io/linuxserver/chromium:latest
    container_name: flow-chromium
    security_opt: [ "seccomp:unconfined" ]
    shm_size: "1gb"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      CUSTOM_USER: "flow"
      PASSWORD: "${BROWSER_PASSWORD}"
      SUBFOLDER: "/browser/"
      CHROME_CLI: "--remote-debugging-port=9222 --lang=en-US https://flow.google.com/"
    volumes:
      - ./chrome-config:/config
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:8787:8787"
    restart: unless-stopped

  mcp:
    build: .
    container_name: flow-mcp
    network_mode: "service:chromium"   # shares localhost with Chrome so it can reach Chrome's debug port
    environment:
      MCP_SECRET: "${MCP_SECRET}"
      PUBLIC_URL: "${PUBLIC_URL}"
      CDP_URL: "http://127.0.0.1:9222"
      DATA_DIR: "/data"
      PORT: "8787"
    volumes:
      - ./data:/data
    depends_on: [ chromium ]
    restart: unless-stopped

  caddy:
    image: caddy:2
    container_name: flow-caddy
    network_mode: host
    environment:
      SITE_HOST: "${SITE_HOST}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [ chromium ]
    restart: unless-stopped

volumes:
  caddy-data: {}
