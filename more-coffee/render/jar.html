<!doctype html><meta charset="utf-8">
<style>@font-face{font-family:Anton;src:url(node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

// ?type=jar|flavour|sachet  &flavour=brew|caramel|hazelnut|vanilla|fudge|cinnamon  &w=&h=
const QP = new URLSearchParams(location.search), W_ = +QP.get("w") || 1000, H_ = +QP.get("h") || 1000;
const TYPE = QP.get("type") || "jar", FLAVOUR = QP.get("flavour") || "brew";
const FL = {
  brew:     { body: "#2b160c", body2: "#3f2314", ink: "#f3e6d0", accent: "#f39a3d", name: "PROTEIN ICED LATTE", ing: "latte-cut" },
  caramel:  { body: "#c9772a", body2: "#b5651d", ink: "#fff3df", accent: "#3a2113", name: "SALTED CARAMEL", ing: "ing-caramel" },
  hazelnut: { body: "#a77a4c", body2: "#8f6538", ink: "#fff3df", accent: "#3a2113", name: "HAZELNUT CRUNCH", ing: "ing-hazelnut" },
  vanilla:  { body: "#ecc86a", body2: "#dcb350", ink: "#3a2113", accent: "#a5541e", name: "VANILLA BEAN", ing: "ing-vanilla" },
  fudge:    { body: "#4d2434", body2: "#3a1827", ink: "#f8e6d8", accent: "#f39a3d", name: "MOCHA FUDGE", ing: "ing-fudge" },
  cinnamon: { body: "#a8431f", body2: "#8e3516", ink: "#ffeedd", accent: "#f6c453", name: "CINNAMON SWIRL", ing: "ing-cinnamon" },
}[FLAVOUR];

const cv = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W_, H_, false); renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.8;
const cam = new THREE.PerspectiveCamera(26, W_ / H_, 0.1, 100); cam.position.set(0, 0.4, 13.8); cam.lookAt(0, 0, 0);
const key = new THREE.DirectionalLight(0xfff4e6, 1.9); key.position.set(-5, 6, 7); scene.add(key);
const fill = new THREE.DirectionalLight(0xe8f0ff, 0.45); fill.position.set(6, 0, 5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe2c0, 1.4); rim.position.set(6, 3, -5); scene.add(rim);

const loadImg = (s) => new Promise((r, j) => { const i = new Image(); i.onload = () => r(i); i.onerror = j; i.src = s; });
const mk = (c) => { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 16; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; return t; };
const v = (x, y) => new THREE.Vector2(x, y);
const white = new THREE.MeshPhysicalMaterial({ color: 0xf6f2ea, roughness: 0.42, clearcoat: 0.18, clearcoatRoughness: 0.4 });

// ---------------------------------------------------------------- label art (full wrap; canvas centre = front)
async function labelCanvas(W, H, F) {
  await document.fonts.load("200px Anton");
  const c = Object.assign(document.createElement("canvas"), { width: W, height: H }), g = c.getContext("2d"), cx = W / 2;
  const bg = g.createLinearGradient(0, 0, 0, H); bg.addColorStop(0, FL.body2); bg.addColorStop(0.55, FL.body); bg.addColorStop(1, FL.body2); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.textBaseline = "alphabetic";
  const ing = await loadImg(`../public/img/label/${FL.ing}.webp`);
    if (TYPE === "jar") {                                                                      // label canvas is ~1.375F tall
    g.fillStyle = FL.ink; g.font = `${F * 0.40}px Anton`; g.fillText("BREW", cx, F * 0.44);
    g.fillStyle = FL.accent; g.fillText("MORE", cx, F * 0.80);
    g.fillStyle = FL.ink; g.font = `${F * 0.042}px Anton`; g.letterSpacing = `${F * 0.008}px`; g.textAlign = "left"; g.fillText("PROTEIN ICED LATTE", cx - F * 0.33, F * 0.895); g.letterSpacing = "0px"; g.textAlign = "center";
    g.globalAlpha = 0.5; g.fillRect(cx - F * 0.33, F * 0.95, F * 0.3, F * 0.006);
    for (let i = 0; i < 4; i++) g.fillRect(cx - F * 0.33, F * (0.98 + i * 0.022), F * (0.27 - i * 0.03), F * 0.005); g.globalAlpha = 1;
    [["25g", "PROTEIN"], ["90mg", "CAFFEINE"], ["0g", "SUGAR"]].forEach(([n, t], i) => {   // three icon badges, bottom-left
      const x = cx - F * 0.27 + i * F * 0.11, y = F * 1.16, r = F * 0.045;
      g.lineWidth = F * 0.004; g.strokeStyle = FL.ink; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
      g.font = `${F * 0.032}px Anton`; g.fillStyle = FL.ink; g.fillText(n, x, y + F * 0.012); g.font = `${F * 0.017}px Anton`; g.fillText(t, x, y + r + F * 0.028);
    });
    { const h = F * 0.62, w = h * ing.width / ing.height; g.drawImage(ing, cx + F * 0.22 - w / 2, F * 0.83, w, h); }   // latte glass bleeding off the bottom
    g.fillStyle = FL.ink; g.font = `${F * 0.16}px Anton`; for (const x of [0, W]) g.fillText("COFFEE, BUT MORE.", x, F * 0.6);
    g.globalAlpha = 0.5; for (let i = 0; i < 12; i++) for (const x of [F * 0.1, W - F * 0.5]) g.fillRect(x, F * (0.8 + i * 0.04), F * (0.2 + (i % 3) * 0.08), F * 0.007); g.globalAlpha = 1;
  } else {                                                                                   // flavour tub: label canvas is ~0.77F tall
    g.fillStyle = FL.ink; g.font = `${F * 0.052}px Anton`; g.letterSpacing = `${F * 0.012}px`; g.textAlign = "left"; g.fillText("BREW MORE", cx - F * 0.4, F * 0.1); g.letterSpacing = "0px";
    g.textAlign = "center"; g.font = `${F * 0.25}px Anton`; g.fillText("FLAVOUR", cx - F * 0.04, F * 0.36); g.fillText("SHOT", cx - F * 0.04, F * 0.585);
    g.textAlign = "left"; g.font = `${F * 0.052}px Anton`; g.fillStyle = FL.accent === "#3a2113" ? FL.ink : FL.accent; g.fillText(FL.name, cx - F * 0.4, F * 0.68);
    g.strokeStyle = FL.ink; g.lineWidth = F * 0.005; g.beginPath(); g.arc(cx + F * 0.37, F * 0.1, F * 0.06, 0, 7); g.stroke();
    g.textAlign = "center"; g.fillStyle = FL.ink; g.font = `${F * 0.04}px Anton`; g.fillText("3g", cx + F * 0.37, F * 0.108); g.font = `${F * 0.016}px Anton`; g.fillText("PER SERVE", cx + F * 0.37, F * 0.135);
    { const h = F * 0.34, w = h * ing.width / ing.height; g.drawImage(ing, cx + F * 0.3 - w / 2, F * 0.42, w, h); }
    g.fillStyle = FL.ink; g.font = `${F * 0.12}px Anton`; for (const x of [0, W]) g.fillText("STIR IN. SWEETEN.", x, F * 0.45);
  }
  return c;
}

// ---------------------------------------------------------------- tub (jar + flavour shot)
const stage = new THREE.Group(); scene.add(stage);
async function buildTub() {
  const jar = TYPE === "jar";
  const R = jar ? 1 : 1.18, LH = jar ? 3.0 : 2.0, BASE = jar ? 0.3 : 0.24, half = LH / 2;
  const shell = [v(0, -half - 0.1), v(R * 0.9, -half - 0.1), v(R * 0.985, -half - 0.06), v(R, -half), v(R, half), v(R * 0.99, half + 0.12), v(R * 0.95, half + 0.18), v(0, half + 0.18)];
  const grp = new THREE.Group();
  grp.add(new THREE.Mesh(new THREE.LatheGeometry(shell, 200), white));
  const lidY = half + 0.18, lidH = jar ? 0.46 : 0.4, lr = R * 1.045;
  const lid = [v(0, lidY), v(lr * 0.97, lidY), v(lr, lidY + 0.04), v(lr, lidY + lidH - 0.1), v(lr * 0.985, lidY + lidH - 0.02), v(lr * 0.93, lidY + lidH + 0.015), v(lr * 0.86, lidY + lidH - 0.01), v(0, lidY + lidH - 0.01)];
  grp.add(new THREE.Mesh(new THREE.LatheGeometry(lid, 200), white));
  const bandH = LH - BASE, W = 6144, F = W / 3.2, Hc = Math.round(W * bandH / (2 * Math.PI * R));
  const tex = mk(await labelCanvas(W, Hc, F)); tex.wrapS = THREE.RepeatWrapping; tex.offset.x = 0.5;
  const band = new THREE.Mesh(new THREE.CylinderGeometry(R * 1.004, R * 1.004, bandH, 200, 1, true), new THREE.MeshPhysicalMaterial({ map: tex, roughness: 0.5, clearcoat: 0.22, clearcoatRoughness: 0.35 }));
  band.position.y = BASE / 2; grp.add(band);
  // thin white cap ring at the band's top edge so the label sits inside the shell
  grp.position.y = jar ? -0.2 : -0.1; stage.add(grp);
}

// ---------------------------------------------------------------- sachet (stick pack)
async function buildSachet() {
  const Wd = 1.0, Ht = 3.5, W = 900, H = Math.round(W * Ht / Wd), F = W * 1.0;
  const c = Object.assign(document.createElement("canvas"), { width: W, height: H }), g = c.getContext("2d");
  await document.fonts.load("200px Anton");
  g.fillStyle = FL.body; g.fillRect(0, 0, W, H);
  const gr = g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, "rgba(255,255,255,.14)"); gr.addColorStop(0.5, "rgba(255,255,255,0)"); gr.addColorStop(1, "rgba(0,0,0,.14)"); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.textAlign = "center"; g.fillStyle = FL.ink;
  g.save(); g.translate(W * 0.5, H * 0.47); g.rotate(-Math.PI / 2); g.font = `${W * 0.52}px Anton`; g.fillText("BREW MORE", 0, W * 0.19); g.restore();
  if (FLAVOUR !== "brew") { const ing = await loadImg(`../public/img/label/${FL.ing}.webp`); const w = W * 0.6, k = w / ing.width; g.drawImage(ing, (W - w) / 2, H * 0.8, w, ing.height * k); }
  else { g.fillStyle = FL.accent; g.fillRect(W * 0.14, H * 0.12, W * 0.06, H * 0.76); }
  g.fillStyle = FL.ink; g.font = `${W * 0.085}px Anton`; g.fillText(FL.name, W / 2, H * 0.1);
  const tex = mk(c);
  // ridged crimp bump at both ends
  const b = Object.assign(document.createElement("canvas"), { width: 64, height: 512 }), bg = b.getContext("2d"); bg.fillStyle = "#808080"; bg.fillRect(0, 0, 64, 512);
  for (let y = 0; y < 512; y += 6) { if (y < 56 || y > 456) { bg.fillStyle = (y / 6) % 2 ? "#ffffff" : "#303030"; bg.fillRect(0, y, 64, 3); } }
  const bump = new THREE.CanvasTexture(b); bump.colorSpace = THREE.NoColorSpace;
  const geo = new THREE.PlaneGeometry(Wd, Ht, 48, 160), pos = geo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i) / (Wd / 2), y = pos.getY(i) / (Ht / 2);
    const body = Math.max(0, 1 - Math.pow(Math.abs(y), 6) * 1.0) * Math.max(0, 1 - Math.pow(Math.abs(x), 2.4)), ends = Math.min(1, (1 - Math.abs(y)) / 0.09);
    pos.setZ(i, 0.2 * body * Math.min(1, ends) + 0.012 * (1 - Math.abs(x)));
  }
  geo.computeVertexNormals();
  const mat = new THREE.MeshPhysicalMaterial({ map: tex, bumpMap: bump, bumpScale: 0.6, metalness: 0.25, roughness: 0.38, clearcoat: 0.5, clearcoatRoughness: 0.25, side: THREE.FrontSide });
  const front = new THREE.Mesh(geo, mat), back = new THREE.Mesh(geo, new THREE.MeshPhysicalMaterial({ color: FL.body, metalness: 0.3, roughness: 0.4, clearcoat: 0.4, side: THREE.BackSide }));
  const grp = new THREE.Group(); grp.add(front, back); stage.add(grp);
}

const jars = [];
window.ready = (async () => {
  if (TYPE === "sachet") await buildSachet(); else await buildTub();
  const base = stage.children[0]; jars.push(base);
  if (TYPE === "jar") { jars.push(base.clone(), base.clone()); stage.add(jars[1], jars[2]); }
  return true;
})();

// poses: array of {ry,rz,rx,x,y,s,z}; missing/null entries hide that object
window.poses = (list) => {
  jars.forEach((j, i) => { const p = list[i]; j.visible = !!p && (p.s ?? 1) > 0.001; if (!j.visible) return;
    const { ry = 0, rz = 0, rx = 0, x = 0, y = 0, s = 1, z = 0 } = p;
    const oy = TYPE === "jar" ? -0.2 : TYPE === "flavour" ? -0.1 : 0;
    j.rotation.set(rx * Math.PI / 180, ry * Math.PI / 180, rz * Math.PI / 180, "ZXY"); j.position.set(x, y + oy, z); j.scale.setScalar(s); });
  renderer.render(scene, cam); return cv.toDataURL("image/png");
};
window.pose = (p) => window.poses([p]);
</script>
