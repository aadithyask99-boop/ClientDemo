<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />

<meta name="robots" content="noindex" />
<title>Client demos</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.6 system-ui, sans-serif; background: #f6f4f1; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { body { background: #151515; color: #eee; } }
  main { width: min(32rem, 88vw); }
  h1 { font-size: 1rem; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; opacity: .6; margin: 0 0 1.4rem; }
  a { display: flex; justify-content: space-between; padding: 1.1rem 0; border-top: 1px solid currentColor; border-color: rgba(128,128,128,.35); color: inherit; text-decoration: none; min-height: 44px; }
  a:last-child { border-bottom: 1px solid rgba(128,128,128,.35); }
  a:hover span:last-child { transform: translateX(4px); }
  span:last-child { transition: transform .3s; opacity: .6; }
</style>
</head>
